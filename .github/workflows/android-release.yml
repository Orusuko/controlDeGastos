name: Compilar y publicar APK de Android

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "android/**"
      - "resources/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "capacitor.config.json"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos publicaciones de la misma release se pisen entre sí.
concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Instalar paquetes del SDK necesarios
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar la web para Android
        run: npm run build:android

      - name: Verificar que el bundle incluye las features
        run: |
          set -euo pipefail
          js=$(ls dist-android/assets/index-*.js | head -n 1)
          echo "Bundle: $js"
          missing=0
          for needle in "Apariencia" "Oscuro" "Editar gasto fijo" "Ordenar por" "control-financiero:v1" "Vista de cuadrícula" "Exportar respaldo" "Importar respaldo"; do
            if grep -qF "$needle" "$js"; then
              echo "OK  $needle"
            else
              echo "FALTA  $needle"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "El JS embebido no contiene las features; no se publica el APK."
            exit 1
          fi

      - name: Sincronizar el proyecto Android
        run: npx cap sync android

      - name: Compilar APK de depuración
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Preparar el APK y las notas de la release
        id: meta
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName "\(.*\)"/\1/p' android/app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' android/app/build.gradle | head -n 1)
          SHA=$(git rev-parse --short HEAD)
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cp android/app/build/outputs/apk/debug/app-debug.apk control-financiero.apk
          cp control-financiero.apk "control-financiero-${VERSION_NAME}.apk"
          cat > release-body.md <<EOF
          APK de depuración generado automáticamente desde \`main\`.

          - **Versión:** ${VERSION_NAME} (versionCode ${VERSION_CODE})
          - **Commit:** \`${SHA}\`
          - **Compilado:** ${STAMP} UTC

          Incluye respaldo JSON (exportar/importar en Ajustes), modo oscuro, detalle por tarjeta, edición de gastos, vista lista/cuadrícula y ordenamiento.

          **Antes de desinstalar:** Ajustes → Exportar respaldo. Guarda el JSON.

          Instálalo **encima** de la app (no desinstales: perderías los datos). Si Android bloquea la instalación por conflicto de firma: exportar → desinstalar → instalar → Importar respaldo.

          Si el navegador te da un APK cacheado, borra \`control-financiero.apk\` de Descargas y vuelve a bajarlo, o usa el archivo versionado \`control-financiero-${VERSION_NAME}.apk\`.

          Comprueba en **Ajustes** que aparezca **v${VERSION_NAME} (${VERSION_CODE})**.

          APK de sideload firmado con el \`debug.keystore\` del repo. No es para Google Play.
          EOF
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Publicar (o actualizar) la release con el APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: Control Financiero (Android)
          body_path: release-body.md
          prerelease: false
          make_latest: true
          files: |
            control-financiero.apk
            control-financiero-${{ steps.meta.outputs.version_name }}.apk
