name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Permite un único despliegue concurrente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        # No usamos "enablement: true" porque GitHub bloquea desde 2022 la
        # creación/activación de un sitio de Pages mediante el GITHUB_TOKEN
        # (siempre devuelve "Resource not accessible by integration",
        # incluso con el permiso "pages: write"). El sitio debe activarse
        # una sola vez de forma manual en Settings > Pages > Build and
        # deployment > Source: "GitHub Actions". Una vez activado, este
        # workflow desplegará correctamente en cada push.

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
